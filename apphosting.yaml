# Firebase App Hosting configuration
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# Secrets are stored in Google Secret Manager. Create them with:
#   firebase apphosting:secrets:set RESEND_API_KEY
#   firebase apphosting:secrets:set DEEPSEEK_API_KEY
# Then grant access:
#   firebase apphosting:secrets:grantaccess RESEND_API_KEY --backend <backend-id>
#   firebase apphosting:secrets:grantaccess DEEPSEEK_API_KEY --backend <backend-id>

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ---- Public Firebase client config (safe to bundle) ----
  # Populate these via the Firebase console (App Hosting → backend → env)
  # or with: firebase apphosting:config:set NEXT_PUBLIC_FIREBASE_API_KEY=...
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SUPER_ADMIN_EMAIL
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_APP_URL
    availability: [BUILD, RUNTIME]

  # ---- Server-only secrets (Secret Manager refs) ----
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability: [RUNTIME]
  - variable: DEEPSEEK_API_KEY
    secret: DEEPSEEK_API_KEY
    availability: [RUNTIME]
